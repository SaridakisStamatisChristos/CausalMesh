    .small{font-size:16px}.tiny{font-size:14px}.body{font-size:19px}.label{font-size:21px;font-weight:700}.section{font-size:29px;font-weight:800}.title{font-size:48px;font-weight:850}.subtitle{font-size:21px;fill:#48627f}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px;fill:#475569}
    .panel{stroke-width:1.7}.box{stroke-width:1.5}.flow{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#arrowBlue)}.flow2{fill:none;stroke:#6d28d9;stroke-width:3;marker-end:url(#arrowPurple)}
