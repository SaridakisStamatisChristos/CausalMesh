<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
<title id="title">CausalMesh Architecture</title>
<desc id="desc">Architecture of the CausalMesh offline-first replicated state engine, showing interfaces, replica engine, durable storage, anti-entropy between replicas, and assurance gates.</desc>
