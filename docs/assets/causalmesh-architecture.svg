  <linearGradient id="sync" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5f1ff"/><stop offset="1" stop-color="#fbf9ff"/></linearGradient>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/></filter>
