name: manifest-sync

on:
  push:
    branches: [r7-zero-to-hero]
    paths:
      - ".ci-trigger"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r7-zero-to-hero
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Revalidate repaired static-analysis surface
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
      - name: Reconcile authoritative manifest without transient workflow
        shell: bash
        run: |
          mv .github/workflows/manifest-sync.yml /tmp/manifest-sync.yml
          python3 scripts/generate_manifest.py
          python3 scripts/verify_manifest.py
          mv /tmp/manifest-sync.yml .github/workflows/manifest-sync.yml
      - name: Commit reconciled manifest
        run: |
          git config user.name "causalmesh-evidence-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/MANIFEST.sha256
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "evidence: reconcile manifest after Clippy repair"
          git push origin HEAD:r7-zero-to-hero
