name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: Apply rustfmt for diagnostic cycle
        run: cargo fmt
      - name: Preserve rustfmt output
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-output
          if-no-files-found: error
          path: |
            src
            tests
            Cargo.lock
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --all-targets
      - name: Release build
        run: cargo build --release
      - name: CLI smoke
        shell: bash
        run: |
          set -euo pipefail
          rm -rf target/cm-a target/cm-b
          BIN=target/release/causalmesh
          if [[ "$RUNNER_OS" == "Windows" ]]; then BIN="${BIN}.exe"; fi
          "$BIN" init target/cm-a
          "$BIN" init target/cm-b
          "$BIN" put target/cm-a k a
          "$BIN" put target/cm-b k b
          "$BIN" sync target/cm-a target/cm-b
          "$BIN" verify target/cm-a
          "$BIN" verify target/cm-b

  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print exact manifest proposal
        run: python scripts/generate_manifest.py
      - name: Verify committed evidence manifest
        run: python scripts/verify_manifest.py
