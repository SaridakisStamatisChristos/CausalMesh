name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --all-targets
      - name: Release build
        run: cargo build --release
      - name: CLI smoke
        shell: bash
        run: |
          set -euo pipefail
          rm -rf target/cm-a target/cm-b
          target/release/causalmesh init target/cm-a
          target/release/causalmesh init target/cm-b
          target/release/causalmesh put target/cm-a k a
          target/release/causalmesh put target/cm-b k b
          target/release/causalmesh sync target/cm-a target/cm-b
          target/release/causalmesh verify target/cm-a
          target/release/causalmesh verify target/cm-b

  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify evidence manifest
        run: python scripts/verify_manifest.py
