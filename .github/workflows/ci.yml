name: ci

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply one-shot R7 hardening patch
        if: github.event_name == 'push' && matrix.os == 'ubuntu-latest' && github.ref == 'refs/heads/r7/zero-to-hero' && hashFiles('repairs/strengthen.patch') != ''
        shell: bash
        run: |
          set -euo pipefail
          git apply repairs/strengthen.patch
          rm repairs/strengthen.patch
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: Apply rustfmt for repair cycle
        run: cargo fmt
      - name: Commit repair output once
        if: github.event_name == 'push' && matrix.os == 'ubuntu-latest' && github.ref == 'refs/heads/r7/zero-to-hero'
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "No repair changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: harden crash recovery and anti-entropy falsification"
          git push origin HEAD:r7/zero-to-hero
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --all-targets
      - name: Release build
        run: cargo build --release
      - name: CLI smoke
        shell: bash
        run: |
          set -euo pipefail
          rm -rf target/cm-a target/cm-b
          BIN=target/release/causalmesh
          if [[ "$RUNNER_OS" == "Windows" ]]; then BIN="${BIN}.exe"; fi
          "$BIN" init target/cm-a
          "$BIN" init target/cm-b
          "$BIN" put target/cm-a k a
          "$BIN" put target/cm-b k b
          "$BIN" sync target/cm-a target/cm-b
          "$BIN" verify target/cm-a
          "$BIN" verify target/cm-b

  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print exact manifest proposal
        run: python scripts/generate_manifest.py
      - name: Verify committed evidence manifest
        run: python scripts/verify_manifest.py
