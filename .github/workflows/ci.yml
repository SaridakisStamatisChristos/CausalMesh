name: ci

on:
  push:
    paths-ignore:
      - ".github/workflows/ci.yml"
      - ".github/workflows/manifest-sync.yml"
      - "evidence/MANIFEST.sha256"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    name: quality-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Require committed lockfile
        run: test -f Cargo.lock
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test all targets
        run: cargo test --all-targets
      - name: Release build
        run: cargo build --release
      - name: Installed CLI smoke
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/causalmesh-install"
          cargo install --locked --path . --root "$root"
          "$root/bin/causalmesh" --version
          a="$(mktemp -d)"
          b="$(mktemp -d)"
          "$root/bin/causalmesh" init "$a"
          "$root/bin/causalmesh" init "$b"
          "$root/bin/causalmesh" put "$a" smoke ok
          "$root/bin/causalmesh" sync "$a" "$b"
          test "$("$root/bin/causalmesh" get "$b" smoke)" = "ok"
          "$root/bin/causalmesh" verify "$b"

  cross-platform:
    name: test-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release

  manifest:
    name: evidence-manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/verify_manifest.py

  audit:
    name: rustsec-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  evidence-close:
    name: evidence-close
    if: github.event_name == 'push' && github.ref == 'refs/heads/r7-zero-to-hero' && github.actor != 'github-actions[bot]'
    needs: [quality, cross-platform, manifest, audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r7-zero-to-hero
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Close R7 evidence
        run: |
          python3 scripts/close_evidence.py
          python3 scripts/generate_manifest.py
      - name: Commit evidence closure
        run: |
          git config user.name "causalmesh-evidence-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence scripts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "evidence: close R7 verification for $GITHUB_SHA"
          git push origin HEAD:r7-zero-to-hero
