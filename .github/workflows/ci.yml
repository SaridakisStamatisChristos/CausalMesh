name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --locked --all-targets
      - name: Release build
        run: cargo build --locked --release
      - name: CLI smoke
        shell: bash
        run: |
          set -euo pipefail
          rm -rf target/cm-a target/cm-b
          BIN=target/release/causalmesh
          if [[ "$RUNNER_OS" == "Windows" ]]; then BIN="${BIN}.exe"; fi
          "$BIN" init target/cm-a
          "$BIN" init target/cm-b
          "$BIN" put target/cm-a k a
          "$BIN" put target/cm-b k b
          "$BIN" sync target/cm-a target/cm-b
          "$BIN" verify target/cm-a
          "$BIN" verify target/cm-b

  benchmark-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Release build
        run: cargo build --locked --release
      - name: Run benchmark smoke
        run: python scripts/benchmark_smoke.py > benchmark-smoke.json
      - name: Show benchmark evidence
        run: cat benchmark-smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-smoke
          path: benchmark-smoke.json
          if-no-files-found: error

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print exact manifest proposal
        run: python scripts/generate_manifest.py
      - name: Verify committed evidence manifest
        run: python scripts/verify_manifest.py
